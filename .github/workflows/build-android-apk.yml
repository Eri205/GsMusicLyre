name: Build Android Auto-Play APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build Debug APK
        working-directory: ./android
        run: |
          gradle assembleDebug --stacktrace

      - name: Rename APK
        run: |
          mkdir -p release_apks
          cp android/app/build/outputs/apk/debug/*.apk release_apks/GsMusicLyre-AutoPlay.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GsMusicLyre-AutoPlay-APK
          path: release_apks/GsMusicLyre-AutoPlay.apk
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: v1.0-android
          name: "GsMusicLyre Android Auto-Play v1.0"
          body: |
            ### 🎵 GsMusicLyre - Bản Android Auto Play Tự Động Trong Game
            - **Cửa sổ nổi (In-Game Overlay)**: Điều khiển phát nhạc nổi ngay trên màn hình game Genshin Impact.
            - **Tự động chạm phím (Accessibility Service)**: Giả lập chạm vào 21 phím đàn trong game chuẩn xác 100%.
            - **Căn chỉnh 21 vị trí phím (Calibration)**: Kéo thả các vòng tròn phím vừa khít với màn hình của từng dòng máy.
            - **Tích hợp sẵn 11 bài nhạc mẫu**.
            
            👉 **Tải file `GsMusicLyre-AutoPlay.apk` bên dưới về điện thoại và cài đặt!**
          files: release_apks/GsMusicLyre-AutoPlay.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
